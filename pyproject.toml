[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfg"
version = "0.3.0"
description = "Python-first LFG Grok plugin runtime for OMO agent hierarchy parity"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "islee23520" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "litellm>=1.85.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.14.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["plugins*"]

[tool.ruff]
target-version = "py311"
line-length = 160
extend-exclude = [
  "plugins/grok-harnessing",
  ".lfg",
  ".grok",
  ".agents",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
  "E402",  # lfg.py keeps late imports near large runtime sections during migration
  "E501",  # long prompt/evidence strings are product contracts
  "E701",  # existing compact provider ordering code remains behavior-tested
  "E702",  # smoke tests keep compact subprocess cleanup in repeated MCP cases
  "E741",  # legacy local variable names are behavior-neutral
  "E401",  # hook scripts keep tiny local imports in fallback parsing blocks
]

[tool.ruff.lint.per-file-ignores]
"tests/smoke/test_grok_build_runtime.py" = ["F401"]
"plugins/lfg/bin/lfg.py" = ["F841"]
"plugins/lfg/hooks/scripts/lfg-goal-harness.py" = ["F841"]
