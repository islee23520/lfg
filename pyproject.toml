[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfg"
version = "0.1.0"
description = "TypeScript/Bun LFG Grok plugin runtime for OMO agent hierarchy parity"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "islee23520" }]
classifiers = [
  "Programming Language :: TypeScript",
]
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["plugins*"]
