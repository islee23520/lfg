name: lfg smoke

on:
  push:
    branches: [main, p1]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Install Python dev tools
        run: python3 -m pip install ruff

      - name: Verify Python syntax
        run: |
          python3 -m py_compile \
            plugins/lfg/bin/lfg.py \
            plugins/lfg/bin/lfg-mcp.py \
            plugins/lfg/bin/self-test.py \
            plugins/lfg/bin/grok-install-smoke.py \
            plugins/lfg/src/runtime/cli.py \
            tests/smoke/test_grok_build_runtime.py

      - name: Run plugin self-test
        run: python3 plugins/lfg/bin/self-test.py
